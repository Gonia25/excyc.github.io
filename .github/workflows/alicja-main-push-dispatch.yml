name: Request Alicja production deployment from main

on:
  push:
    branches: [main]
    paths:
      - "deployment-triggers/alicja-main-dispatch-*.txt"

permissions:
  actions: read
  contents: write

concurrency:
  group: alicja-main-dispatch
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch and monitor trusted production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create repository_dispatch event and wait for production run
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          status="$(curl --location --silent --show-error \
            --output /tmp/dispatch-response.txt \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            --data "{\"event_type\":\"alicja-production-deploy\",\"client_payload\":{\"source_pr\":\"main-push\",\"source_head_sha\":\"${TRIGGER_SHA}\"}}")"
          test "${status}" = '204'
          echo "repository_dispatch accepted at ${dispatched_at}."

          production_run=''
          for attempt in $(seq 1 120); do
            curl --location --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs?event=repository_dispatch&per_page=100" \
              > /tmp/repository-dispatch-runs.json
            production_run="$(DISPATCHED_AT="${dispatched_at}" python3 - <<'PY'
          import datetime, json, os
          with open('/tmp/repository-dispatch-runs.json', encoding='utf-8') as handle:
              data = json.load(handle)
          cutoff = datetime.datetime.fromisoformat(os.environ['DISPATCHED_AT'].replace('Z', '+00:00'))
          candidates = []
          for run in data.get('workflow_runs', []):
              created = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              if run.get('event') == 'repository_dispatch' and run.get('name') == 'Alicja Studio production deploy and live proof' and created >= cutoff:
                  candidates.append(run)
          print(max((run['id'] for run in candidates), default=''))
          PY
            )"
            echo "Discovery ${attempt}/120: production=${production_run:-not visible yet}"
            [ -n "${production_run}" ] && break
            sleep 10
          done
          test -n "${production_run}"
          echo "http_status=${status}" >> "${GITHUB_OUTPUT}"
          echo "dispatched_at=${dispatched_at}" >> "${GITHUB_OUTPUT}"
          echo "production_run=${production_run}" >> "${GITHUB_OUTPUT}"

      - name: Record accepted dispatch and production run ID
        env:
          PRODUCTION_RUN: ${{ steps.request.outputs.production_run }}
          DISPATCHED_AT: ${{ steps.request.outputs.dispatched_at }}
          HTTP_STATUS: ${{ steps.request.outputs.http_status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-verification
          cat > deployment-verification/alicja-main-dispatch.json <<EOF
          {
            "state": "accepted",
            "httpStatus": "${HTTP_STATUS}",
            "dispatcherWorkflowRunId": "${GITHUB_RUN_ID}",
            "dispatcherWorkflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "triggerCommit": "${GITHUB_SHA}",
            "dispatchedAt": "${DISPATCHED_AT}",
            "productionRunId": "${PRODUCTION_RUN}"
          }
          EOF
          git config user.name 'Alicja Main Dispatch'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-verification/alicja-main-dispatch.json
          git commit -m 'Record Alicja production dispatch request [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Monitor production deployment through completion
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PRODUCTION_RUN: ${{ steps.request.outputs.production_run }}
        shell: bash
        run: |
          set -euo pipefail
          final_status=''
          final_conclusion='pending'
          final_url=''
          for attempt in $(seq 1 240); do
            curl --location --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs/${PRODUCTION_RUN}" \
              > /tmp/production-run.json
            read -r final_status final_conclusion final_url < <(python3 - <<'PY'
          import json
          with open('/tmp/production-run.json', encoding='utf-8') as handle:
              run = json.load(handle)
          print(run.get('status') or '', run.get('conclusion') or 'pending', run.get('html_url') or '')
          PY
            )
            echo "Production ${attempt}/240: status=${final_status} conclusion=${final_conclusion}"
            [ "${final_status}" = 'completed' ] && break
            sleep 10
          done
          test "${final_status}" = 'completed'
          curl --location --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${PRODUCTION_RUN}/jobs?per_page=100" \
            > /tmp/production-jobs.json
          echo "status=${final_status}" >> "${GITHUB_OUTPUT}"
          echo "conclusion=${final_conclusion}" >> "${GITHUB_OUTPUT}"
          echo "url=${final_url}" >> "${GITHUB_OUTPUT}"

      - name: Record final monitored production result
        if: ${{ always() && steps.request.outcome == 'success' }}
        env:
          PRODUCTION_RUN: ${{ steps.request.outputs.production_run }}
          RUN_STATUS: ${{ steps.monitor.outputs.status || 'unknown' }}
          RUN_CONCLUSION: ${{ steps.monitor.outputs.conclusion || 'unknown' }}
          RUN_URL: ${{ steps.monitor.outputs.url || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-verification
          python3 - <<'PY'
          import json, os
          jobs = []
          try:
              with open('/tmp/production-jobs.json', encoding='utf-8') as handle:
                  jobs = [{
                      'id': job.get('id'),
                      'name': job.get('name'),
                      'status': job.get('status'),
                      'conclusion': job.get('conclusion'),
                      'startedAt': job.get('started_at'),
                      'completedAt': job.get('completed_at'),
                  } for job in json.load(handle).get('jobs', [])]
          except FileNotFoundError:
              pass
          report = {
              'state': 'completed' if os.environ['RUN_STATUS'] == 'completed' else 'unknown',
              'productionRunId': os.environ['PRODUCTION_RUN'],
              'status': os.environ['RUN_STATUS'],
              'conclusion': os.environ['RUN_CONCLUSION'],
              'runUrl': os.environ['RUN_URL'],
              'monitoredByWorkflowRunId': os.environ['GITHUB_RUN_ID'],
              'jobs': jobs,
          }
          with open('deployment-verification/alicja-main-production-monitor.json', 'w', encoding='utf-8') as handle:
              json.dump(report, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          PY
          git config user.name 'Alicja Main Dispatch'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-verification/alicja-main-production-monitor.json
          git commit -m "Record monitored Alicja production result: ${RUN_CONCLUSION} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          test "${RUN_CONCLUSION}" = 'success'
