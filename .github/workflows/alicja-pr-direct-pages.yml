name: Alicja final direct Pages deployment

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  LIVE_URL: https://gonia25.github.io/excyc.github.io/alicja-studio-wnetrz/
  SOURCE_FILE: alicja-studio-wnetrz/index.html

concurrency:
  group: alicja-final-direct-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish corrected main branch
    if: ${{ startsWith(github.head_ref, 'agent/alicja-final-pr-deploy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Validate direct browser-compatible source
        shell: bash
        run: |
          set -euo pipefail
          test -f "${SOURCE_FILE}"
          grep -Fq '<title>Alicja Studio Wnętrz — architektura wnętrz</title>' "${SOURCE_FILE}"
          grep -Fq 'Wnętrza tworzone' "${SOURCE_FILE}"
          test "$(grep -o 'class="project reveal"' "${SOURCE_FILE}" | wc -l | tr -d ' ')" = '6'
          ! grep -Fq 'Ta przeglądarka nie obsługuje prezentacji' "${SOURCE_FILE}"
          ! grep -Fq 'DecompressionStream' "${SOURCE_FILE}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete static repository
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
          error_count: 30
          reporting_interval: 10000

  verify:
    name: Prove public site in Chromium and iPad WebKit
    if: ${{ always() && startsWith(github.head_ref, 'agent/alicja-final-pr-deploy') }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out trusted main for evidence
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require corrected HTML from the actual public URL
        id: http
        if: ${{ needs.deploy.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-verification
          url="${LIVE_URL}?final-proof=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          log="deployment-verification/alicja-final-${GITHUB_RUN_ID}-http.log"
          : > "${log}"
          passed=0
          for attempt in $(seq 1 90); do
            code="$(curl --location --silent --show-error \
              --output /tmp/alicja-final-live.html \
              --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "${url}" 2>>"${log}" || true)"
            title=0; heading=0; projects=0; fallback=0; loader=0
            grep -Fq '<title>Alicja Studio Wnętrz — architektura wnętrz</title>' /tmp/alicja-final-live.html 2>/dev/null && title=1 || true
            grep -Fq 'Wnętrza tworzone' /tmp/alicja-final-live.html 2>/dev/null && heading=1 || true
            projects="$(grep -o 'class="project reveal"' /tmp/alicja-final-live.html 2>/dev/null | wc -l | tr -d ' ')"
            grep -Fq 'Ta przeglądarka nie obsługuje prezentacji' /tmp/alicja-final-live.html 2>/dev/null && fallback=1 || true
            grep -Fq 'DecompressionStream' /tmp/alicja-final-live.html 2>/dev/null && loader=1 || true
            printf 'attempt=%s http=%s title=%s heading=%s projects=%s fallback=%s loader=%s\n' \
              "${attempt}" "${code}" "${title}" "${heading}" "${projects}" "${fallback}" "${loader}" | tee -a "${log}"
            if [ "${code}" = '200' ] && [ "${title}" = '1' ] && [ "${heading}" = '1' ] \
              && [ "${projects}" = '6' ] && [ "${fallback}" = '0' ] && [ "${loader}" = '0' ]; then
              passed=1
              break
            fi
            sleep 10
          done
          test "${passed}" = '1'
          cp /tmp/alicja-final-live.html "deployment-verification/alicja-final-${GITHUB_RUN_ID}-live.html"
          echo "test_url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Install Playwright
        if: ${{ steps.http.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alicja-final-browser
          cd /tmp/alicja-final-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit

      - name: Exercise the live site in both required browsers
        id: browser
        if: ${{ steps.http.outcome == 'success' }}
        env:
          TEST_URL: ${{ steps.http.outputs.test_url }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/alicja-final-browser/verify.cjs <<'NODE'
          const { chromium, webkit, devices } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.resolve(process.env.GITHUB_WORKSPACE, 'deployment-verification');
          const cases = [
            ['desktop-chromium', chromium, { viewport: { width: 1440, height: 1000 }, locale: 'pl-PL' }],
            ['ipad-webkit', webkit, { ...devices['iPad Pro 11'], locale: 'pl-PL' }]
          ];

          async function testCase([name, engine, contextOptions]) {
            const browser = await engine.launch({ headless: true });
            const context = await browser.newContext(contextOptions);
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            const response = await page.goto(process.env.TEST_URL, { waitUntil: 'domcontentloaded', timeout: 90000 });
            if (!response || response.status() !== 200) throw new Error(`${name}: HTTP ${response?.status()}`);
            await page.waitForSelector('.hero h1', { state: 'visible', timeout: 30000 });
            await page.waitForTimeout(1200);
            const state = await page.evaluate(() => ({
              title: document.title,
              heading: document.querySelector('.hero h1')?.innerText || '',
              projectCount: document.querySelectorAll('.project').length,
              fallback: document.body.innerText.toLowerCase().includes('przeglądarka nie obsługuje prezentacji'),
              loader: document.documentElement.innerHTML.includes('DecompressionStream'),
              bodyWidth: document.body.scrollWidth,
              viewportWidth: innerWidth
            }));
            if (state.title !== 'Alicja Studio Wnętrz — architektura wnętrz') throw new Error(`${name}: wrong title`);
            if (!state.heading.includes('Wnętrza tworzone')) throw new Error(`${name}: hero missing`);
            if (state.projectCount !== 6) throw new Error(`${name}: expected 6 projects`);
            if (state.fallback || state.loader) throw new Error(`${name}: obsolete loader survived`);
            if (state.bodyWidth > state.viewportWidth + 2) throw new Error(`${name}: horizontal overflow`);

            const cookies = page.locator('#cookies');
            if (await cookies.isVisible()) await page.locator('#essential').click();
            await page.locator('#realizacje').scrollIntoViewIfNeeded();
            await page.locator('.filter[data-filter="domy"]').click();
            await page.waitForTimeout(200);
            const houses = await page.locator('.project:not(.hidden)').count();
            if (houses !== 2) throw new Error(`${name}: portfolio filter returned ${houses}`);
            await page.locator('.filter[data-filter="all"]').click();
            await page.locator('.project-open').first().click();
            await page.waitForSelector('#lightbox.open', { state: 'visible', timeout: 10000 });
            await page.locator('#close').click();

            let mobileMenuTested = false;
            const menu = page.locator('#menu');
            if (await menu.isVisible()) {
              mobileMenuTested = true;
              await menu.click();
              if ((await menu.getAttribute('aria-expanded')) !== 'true') throw new Error(`${name}: menu failed`);
              await menu.click();
            }

            await page.locator('#kontakt').scrollIntoViewIfNeeded();
            await page.locator('#contact-form button[type="submit"]').click();
            const validation = await page.locator('#status').innerText();
            if (!validation.includes('Uzupełnij wymagane pola')) throw new Error(`${name}: form validation failed`);
            await page.screenshot({ path: path.join(out, `alicja-final-${process.env.GITHUB_RUN_ID}-${name}.png`), fullPage: true });
            await browser.close();
            return { name, passed: true, responseStatus: response.status(), state, houses, mobileMenuTested, validation, pageErrors };
          }

          (async () => {
            const browsers = [];
            for (const item of cases) browsers.push(await testCase(item));
            const report = {
              state: 'passed',
              canonicalUrl: process.env.LIVE_URL,
              testedUrl: process.env.TEST_URL,
              workflowRunId: process.env.GITHUB_RUN_ID,
              sourceCommit: process.env.GITHUB_SHA,
              verifiedAt: new Date().toISOString(),
              browsers
            };
            fs.writeFileSync(path.join(out, `alicja-final-${process.env.GITHUB_RUN_ID}-outcome.json`), JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node /tmp/alicja-final-browser/verify.cjs | tee "deployment-verification/alicja-final-${GITHUB_RUN_ID}-browser.log"

      - name: Upload proof artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: alicja-final-proof-${{ github.run_id }}
          path: deployment-verification/alicja-final-${{ github.run_id }}-*
          if-no-files-found: warn
          retention-days: 30

      - name: Commit successful proof to main
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alicja Final Verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "deployment-verification/alicja-final-${GITHUB_RUN_ID}-"*
          git commit -m "Record Alicja final public verification passed run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require complete success
        if: ${{ always() }}
        shell: bash
        run: |
          test "${{ needs.deploy.result }}" = 'success'
          test "${{ steps.http.outcome }}" = 'success'
          test "${{ steps.browser.outcome }}" = 'success'
