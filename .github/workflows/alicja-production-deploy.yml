name: Alicja Studio production deploy and live proof

on:
  repository_dispatch:
    types: [alicja-production-deploy]
  workflow_dispatch:
  workflow_run:
    workflows: ["Alicja final deployment launcher"]
    types: [completed]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  LIVE_URL: https://gonia25.github.io/excyc.github.io/alicja-studio-wnetrz/
  SOURCE_FILE: alicja-studio-wnetrz/index.html

concurrency:
  group: alicja-pages-production
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    name: Publish corrected site and prove the public result
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'agent/alicja-final-launch')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out current trusted main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate direct browser-compatible source
        shell: bash
        run: |
          set -euo pipefail
          test -f "${SOURCE_FILE}"
          grep -Fq '<title>Alicja Studio Wnętrz — architektura wnętrz</title>' "${SOURCE_FILE}"
          grep -Fq 'Wnętrza tworzone' "${SOURCE_FILE}"
          test "$(grep -o 'class="project reveal"' "${SOURCE_FILE}" | wc -l | tr -d ' ')" = '6'
          ! grep -Fq 'Ta przeglądarka nie obsługuje prezentacji' "${SOURCE_FILE}"
          ! grep -Fq 'DecompressionStream' "${SOURCE_FILE}"

      - name: Record the exact production run ID on main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-verification
          cat > deployment-verification/alicja-production-active.json <<EOF
          {
            "state": "running",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "event": "${GITHUB_EVENT_NAME}",
            "trustedMainCommit": "$(git rev-parse HEAD)",
            "triggerHeadBranch": "${{ github.event.workflow_run.head_branch || 'direct-dispatch' }}",
            "triggerHeadSha": "${{ github.event.workflow_run.head_sha || github.event.client_payload.source_head_sha || 'manual' }}",
            "startedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'Alicja Production Verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-verification/alicja-production-active.json
          git commit -m 'Record active Alicja production deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload complete static repository
        id: upload
        if: ${{ steps.configure.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages artifact
        id: pages
        if: ${{ steps.upload.outcome == 'success' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
          error_count: 30
          reporting_interval: 10000

      - name: Require corrected HTML from the actual public URL
        id: http
        if: ${{ steps.pages.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          url="${LIVE_URL}?production-proof=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          log='deployment-verification/alicja-production-http.log'
          : > "${log}"
          passed=0
          for attempt in $(seq 1 90); do
            code="$(curl --location --silent --show-error \
              --output /tmp/alicja-production-live.html \
              --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "${url}" 2>>"${log}" || true)"
            title=0; heading=0; projects=0; fallback=0; loader=0
            grep -Fq '<title>Alicja Studio Wnętrz — architektura wnętrz</title>' /tmp/alicja-production-live.html 2>/dev/null && title=1 || true
            grep -Fq 'Wnętrza tworzone' /tmp/alicja-production-live.html 2>/dev/null && heading=1 || true
            projects="$(grep -o 'class="project reveal"' /tmp/alicja-production-live.html 2>/dev/null | wc -l | tr -d ' ')"
            grep -Fq 'Ta przeglądarka nie obsługuje prezentacji' /tmp/alicja-production-live.html 2>/dev/null && fallback=1 || true
            grep -Fq 'DecompressionStream' /tmp/alicja-production-live.html 2>/dev/null && loader=1 || true
            printf 'attempt=%s http=%s title=%s heading=%s projects=%s fallback=%s loader=%s\n' \
              "${attempt}" "${code}" "${title}" "${heading}" "${projects}" "${fallback}" "${loader}" | tee -a "${log}"
            if [ "${code}" = '200' ] && [ "${title}" = '1' ] && [ "${heading}" = '1' ] \
              && [ "${projects}" = '6' ] && [ "${fallback}" = '0' ] && [ "${loader}" = '0' ]; then
              passed=1
              break
            fi
            sleep 10
          done
          test "${passed}" = '1'
          cp /tmp/alicja-production-live.html deployment-verification/alicja-production-live.html
          echo "test_url=${url}" >> "${GITHUB_OUTPUT}"
          echo "bytes=$(wc -c < /tmp/alicja-production-live.html | tr -d ' ')" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(sha256sum /tmp/alicja-production-live.html | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Install Playwright
        id: install
        if: ${{ steps.http.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alicja-production-browser
          cd /tmp/alicja-production-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit

      - name: Exercise the actual public page
        id: browser
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        env:
          TEST_URL: ${{ steps.http.outputs.test_url }}
          HTTP_BYTES: ${{ steps.http.outputs.bytes }}
          HTTP_SHA256: ${{ steps.http.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/alicja-production-browser/verify.cjs <<'NODE'
          const { chromium, webkit, devices } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const out = path.resolve(process.env.GITHUB_WORKSPACE, 'deployment-verification');
          const cases = [
            ['desktop-chromium', chromium, { viewport: { width: 1440, height: 1000 }, locale: 'pl-PL' }],
            ['ipad-webkit', webkit, { ...devices['iPad Pro 11'], locale: 'pl-PL' }]
          ];

          async function exercise([name, engine, contextOptions]) {
            const browser = await engine.launch({ headless: true });
            const context = await browser.newContext(contextOptions);
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            const response = await page.goto(process.env.TEST_URL, { waitUntil: 'domcontentloaded', timeout: 90000 });
            if (!response || response.status() !== 200) throw new Error(`${name}: HTTP ${response?.status()}`);
            await page.waitForSelector('.hero h1', { state: 'visible', timeout: 30000 });
            await page.waitForTimeout(1200);
            const state = await page.evaluate(() => ({
              title: document.title,
              heading: document.querySelector('.hero h1')?.innerText || '',
              projectCount: document.querySelectorAll('.project').length,
              fallback: document.body.innerText.toLowerCase().includes('przeglądarka nie obsługuje prezentacji'),
              loader: document.documentElement.innerHTML.includes('DecompressionStream'),
              bodyWidth: document.body.scrollWidth,
              viewportWidth: innerWidth
            }));
            if (state.title !== 'Alicja Studio Wnętrz — architektura wnętrz') throw new Error(`${name}: wrong title`);
            if (!state.heading.includes('Wnętrza tworzone')) throw new Error(`${name}: intended hero missing`);
            if (state.projectCount !== 6) throw new Error(`${name}: expected six projects`);
            if (state.fallback || state.loader) throw new Error(`${name}: obsolete fallback survived`);
            if (state.bodyWidth > state.viewportWidth + 2) throw new Error(`${name}: horizontal overflow`);

            const cookies = page.locator('#cookies');
            if (await cookies.isVisible()) await page.locator('#essential').click();
            await page.locator('#realizacje').scrollIntoViewIfNeeded();
            await page.locator('.filter[data-filter="domy"]').click();
            await page.waitForTimeout(200);
            const houses = await page.locator('.project:not(.hidden)').count();
            if (houses !== 2) throw new Error(`${name}: portfolio filter returned ${houses}`);
            await page.locator('.filter[data-filter="all"]').click();
            await page.locator('.project-open').first().click();
            await page.waitForSelector('#lightbox.open', { state: 'visible', timeout: 10000 });
            await page.locator('#close').click();

            let mobileMenuTested = false;
            const menu = page.locator('#menu');
            if (await menu.isVisible()) {
              mobileMenuTested = true;
              await menu.click();
              if ((await menu.getAttribute('aria-expanded')) !== 'true') throw new Error(`${name}: mobile menu failed`);
              if (!(await page.locator('#nav').evaluate(n => n.classList.contains('open')))) throw new Error(`${name}: menu panel failed`);
              await menu.click();
            }

            await page.locator('#kontakt').scrollIntoViewIfNeeded();
            await page.locator('#contact-form button[type="submit"]').click();
            const validation = await page.locator('#status').innerText();
            if (!validation.includes('Uzupełnij wymagane pola')) throw new Error(`${name}: form validation failed`);
            await page.locator('input[name="name"]').fill('Test użytkownika');
            await page.locator('input[name="email"]').fill('test@example.com');
            await page.locator('select[name="type"]').selectOption({ label: 'Mieszkanie' });
            await page.locator('textarea[name="message"]').fill('Test formularza demonstracyjnego.');
            await page.locator('.consent input').check();
            await page.locator('#contact-form button[type="submit"]').click();
            const success = await page.locator('#status').innerText();
            if (!success.includes('Formularz działa prawidłowo')) throw new Error(`${name}: form completion failed`);
            const screenshot = `alicja-production-${name}.png`;
            await page.locator('#start').scrollIntoViewIfNeeded();
            await page.screenshot({ path: path.join(out, screenshot), fullPage: true });
            await browser.close();
            return { name, passed: true, responseStatus: response.status(), state, houses, mobileMenuTested, validation, success, pageErrors, consoleErrors, screenshot };
          }

          (async () => {
            const browsers = [];
            for (const item of cases) browsers.push(await exercise(item));
            const report = {
              state: 'passed',
              canonicalUrl: process.env.LIVE_URL,
              testedUrl: process.env.TEST_URL,
              workflowRunId: process.env.GITHUB_RUN_ID,
              workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
              trustedMainCommit: process.env.GITHUB_SHA,
              verifiedAt: new Date().toISOString(),
              httpBytes: Number(process.env.HTTP_BYTES),
              httpSha256: process.env.HTTP_SHA256,
              browsers
            };
            fs.writeFileSync(path.join(out, 'alicja-production-live.json'), JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
          })().catch(error => {
            fs.writeFileSync(path.join(out, 'alicja-production-browser-failure.txt'), `${error.stack || error}\n`);
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/alicja-production-browser/verify.cjs | tee deployment-verification/alicja-production-browser.log

      - name: Write final outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          state=failed
          if [ "${{ steps.configure.outcome }}" = 'success' ] \
            && [ "${{ steps.upload.outcome }}" = 'success' ] \
            && [ "${{ steps.pages.outcome }}" = 'success' ] \
            && [ "${{ steps.http.outcome }}" = 'success' ] \
            && [ "${{ steps.install.outcome }}" = 'success' ] \
            && [ "${{ steps.browser.outcome }}" = 'success' ] \
            && [ -f deployment-verification/alicja-production-live.json ]; then
            state=passed
          fi
          cat > deployment-verification/alicja-production-outcome.json <<EOF
          {
            "state": "${state}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "event": "${GITHUB_EVENT_NAME}",
            "configureOutcome": "${{ steps.configure.outcome }}",
            "uploadOutcome": "${{ steps.upload.outcome }}",
            "deployOutcome": "${{ steps.pages.outcome }}",
            "httpOutcome": "${{ steps.http.outcome }}",
            "browserInstallOutcome": "${{ steps.install.outcome }}",
            "browserOutcome": "${{ steps.browser.outcome }}",
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: alicja-production-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-verification/alicja-production-*
          if-no-files-found: error
          retention-days: 30

      - name: Record final evidence on main
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alicja Production Verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-verification/alicja-production-*
          if git diff --cached --quiet; then exit 0; fi
          state="$(python3 -c "import json; print(json.load(open('deployment-verification/alicja-production-outcome.json'))['state'])")"
          git commit -m "Record Alicja production verification: ${state} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Require complete success
        if: ${{ always() }}
        shell: bash
        run: |
          test "${{ steps.configure.outcome }}" = 'success'
          test "${{ steps.upload.outcome }}" = 'success'
          test "${{ steps.pages.outcome }}" = 'success'
          test "${{ steps.http.outcome }}" = 'success'
          test "${{ steps.install.outcome }}" = 'success'
          test "${{ steps.browser.outcome }}" = 'success'
