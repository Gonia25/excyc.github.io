name: Dispatch Alicja production deployment

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: alicja-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Request trusted main-branch deployment
    if: ${{ startsWith(github.head_ref, 'agent/run-alicja-live-verification') }}
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Create repository_dispatch event and identify resulting runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          response_headers="$(mktemp)"
          status="$(curl --location --silent --show-error \
            --output /tmp/dispatch-response.txt \
            --dump-header "${response_headers}" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/dispatches" \
            --data "{\"event_type\":\"alicja-production-deploy\",\"client_payload\":{\"source_pr\":${PR_NUMBER},\"source_head_sha\":\"${PR_HEAD_SHA}\"}}")"
          cat "${response_headers}"
          cat /tmp/dispatch-response.txt || true
          test "${status}" = '204'
          echo "repository_dispatch accepted with HTTP ${status} at ${dispatched_at}."

          found=0
          for attempt in $(seq 1 30); do
            curl --location --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/${REPOSITORY}/actions/runs?event=repository_dispatch&per_page=30" \
              > /tmp/repository-dispatch-runs.json

            found="$(DISPATCHED_AT="${dispatched_at}" python3 - <<'PY'
          import datetime, json, os
          with open('/tmp/repository-dispatch-runs.json', encoding='utf-8') as handle:
              data = json.load(handle)
          cutoff = datetime.datetime.fromisoformat(os.environ['DISPATCHED_AT'].replace('Z', '+00:00'))
          wanted = {
              'Alicja Studio production deploy and live proof',
              'Probe Alicja repository dispatch',
          }
          runs = []
          for run in data.get('workflow_runs', []):
              created = datetime.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
              if run.get('event') == 'repository_dispatch' and run.get('name') in wanted and created >= cutoff:
                  runs.append(run)
          runs.sort(key=lambda item: item['id'])
          for run in runs:
              print(f"DISCOVERED_RUN id={run['id']} name={run['name']} status={run['status']} conclusion={run['conclusion']} created_at={run['created_at']}", file=os.sys.stderr)
          print(len(runs))
          PY
            )"
            echo "Run discovery attempt ${attempt}: found ${found} matching runs."
            if [ "${found}" -ge 2 ]; then
              break
            fi
            sleep 2
          done

          test "${found}" -ge 2
          echo 'Both the production deployment and independent dispatch-probe runs were created.'
