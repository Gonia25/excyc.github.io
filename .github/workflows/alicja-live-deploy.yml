name: Deploy and verify Alicja Studio live site

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

env:
  LIVE_URL: https://gonia25.github.io/excyc.github.io/alicja-studio-wnetrz/

concurrency:
  group: alicja-pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Package trusted main branch
    if: ${{ github.event.pull_request.base.ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted main branch only
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Confirm corrected direct HTML is being packaged
        shell: bash
        run: |
          set -euo pipefail
          test -f alicja-studio-wnetrz/index.html
          grep -Fq 'Alicja Studio Wnętrz — architektura wnętrz' alicja-studio-wnetrz/index.html
          grep -Fq 'Wnętrza tworzone' alicja-studio-wnetrz/index.html
          ! grep -Fq 'Ta przeglądarka nie obsługuje prezentacji' alicja-studio-wnetrz/index.html
          ! grep -Fq 'DecompressionStream' alicja-studio-wnetrz/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete static repository
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    name: Deploy trusted artifact to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000

  verify:
    name: Verify the actual public page in Chromium and iPad WebKit
    needs: deploy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out trusted main branch for evidence output
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Create verification workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-verification
          cat > deployment-verification/alicja-run.json <<EOF
          {
            "state": "running",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "triggerEvent": "${GITHUB_EVENT_NAME}",
            "trustedMainCommit": "$(git rev-parse HEAD)",
            "deployJobResult": "${{ needs.deploy.result }}",
            "startedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Poll the public URL until the corrected artifact is live
        id: http
        if: ${{ needs.deploy.result == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          URL="${LIVE_URL}?release=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          LOG=deployment-verification/alicja-http.log
          : > "${LOG}"
          echo "target=${URL}" | tee -a "${LOG}"
          passed=0

          for attempt in $(seq 1 60); do
            code="$(curl --location --silent --show-error --output /tmp/alicja-live.html --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              --header 'Expires: 0' \
              "${URL}" 2>>"${LOG}" || true)"
            bytes="$(wc -c < /tmp/alicja-live.html 2>/dev/null | tr -d ' ' || echo 0)"
            title=0; heading=0; fallback=0; loader=0; projects=0
            grep -Fq 'Alicja Studio Wnętrz — architektura wnętrz' /tmp/alicja-live.html 2>/dev/null && title=1 || true
            grep -Fq 'Wnętrza tworzone' /tmp/alicja-live.html 2>/dev/null && heading=1 || true
            grep -Fq 'Ta przeglądarka nie obsługuje prezentacji' /tmp/alicja-live.html 2>/dev/null && fallback=1 || true
            grep -Fq 'DecompressionStream' /tmp/alicja-live.html 2>/dev/null && loader=1 || true
            projects="$(grep -o 'class="project reveal"' /tmp/alicja-live.html 2>/dev/null | wc -l | tr -d ' ')"

            printf 'attempt=%s http=%s bytes=%s title=%s heading=%s projects=%s oldFallback=%s oldLoader=%s\n' \
              "${attempt}" "${code}" "${bytes}" "${title}" "${heading}" "${projects}" "${fallback}" "${loader}" \
              | tee -a "${LOG}"

            if [ "${code}" = "200" ] \
              && [ "${title}" = "1" ] \
              && [ "${heading}" = "1" ] \
              && [ "${projects}" = "6" ] \
              && [ "${fallback}" = "0" ] \
              && [ "${loader}" = "0" ]; then
              passed=1
              break
            fi
            sleep 10
          done

          cp /tmp/alicja-live.html deployment-verification/alicja-live-response.html 2>/dev/null || true
          if [ "${passed}" != "1" ]; then
            echo 'result=failed: corrected HTML never reached the public URL' | tee -a "${LOG}"
            exit 1
          fi

          bytes="$(wc -c < /tmp/alicja-live.html | tr -d ' ')"
          hash="$(sha256sum /tmp/alicja-live.html | awk '{print $1}')"
          printf '%s\n' "TEST_URL=${URL}" "HTTP_BYTES=${bytes}" "HTTP_SHA256=${hash}" >> "${GITHUB_ENV}"
          echo 'result=passed' | tee -a "${LOG}"

      - name: Install browser test runtime
        id: browser_install
        if: ${{ steps.http.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p /tmp/alicja-browser-test
          cd /tmp/alicja-browser-test
          npm init -y > /dev/null 2>&1
          npm install --no-audit --no-fund playwright@latest 2>&1 \
            | tee "${GITHUB_WORKSPACE}/deployment-verification/alicja-browser-install.log"
          npx playwright install --with-deps chromium webkit 2>&1 \
            | tee -a "${GITHUB_WORKSPACE}/deployment-verification/alicja-browser-install.log"

      - name: Exercise live interactions in Chromium and iPad WebKit
        id: browser
        if: ${{ steps.http.outcome == 'success' && steps.browser_install.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          cat > /tmp/alicja-browser-test/verify.cjs <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium, webkit } = require('playwright');

          const url = process.env.TEST_URL;
          const outputDir = path.resolve(process.cwd(), 'deployment-verification');
          fs.mkdirSync(outputDir, { recursive: true });

          const cases = [
            {
              name: 'chromium-desktop',
              launcher: chromium,
              context: {
                viewport: { width: 1440, height: 1000 },
                deviceScaleFactor: 1
              }
            },
            {
              name: 'webkit-ipad-in-app',
              launcher: webkit,
              context: {
                viewport: { width: 768, height: 1024 },
                deviceScaleFactor: 2,
                hasTouch: true,
                isMobile: true,
                userAgent: 'Mozilla/5.0 (iPad; CPU OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
              }
            }
          ];

          async function testBrowser(testCase) {
            const browser = await testCase.launcher.launch({ headless: true });
            const context = await browser.newContext(testCase.context);
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            const failedRequests = [];

            page.on('console', message => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', error => pageErrors.push(error.message));
            page.on('requestfailed', request => {
              const failure = request.failure();
              failedRequests.push({ url: request.url(), error: failure ? failure.errorText : 'unknown' });
            });

            const response = await page.goto(url, {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });
            await page.waitForSelector('.hero h1', { state: 'visible', timeout: 120000 });
            await page.waitForTimeout(1200);

            const initial = await page.evaluate(() => ({
              title: document.title,
              heading: document.querySelector('.hero h1')?.innerText.trim() || '',
              fallbackPresent: document.body.innerText.includes('Ta przeglądarka nie obsługuje prezentacji'),
              decompressionLoaderPresent: document.documentElement.innerHTML.includes('DecompressionStream'),
              projectCount: document.querySelectorAll('.project').length,
              navPresent: Boolean(document.querySelector('#nav')),
              formPresent: Boolean(document.querySelector('#contact-form')),
              bodyTextLength: document.body.innerText.length
            }));

            if (!response || response.status() !== 200) throw new Error(`${testCase.name}: HTTP ${response ? response.status() : 'no response'}`);
            if (initial.title !== 'Alicja Studio Wnętrz — architektura wnętrz') throw new Error(`${testCase.name}: wrong title: ${initial.title}`);
            if (!initial.heading.includes('Wnętrza tworzone')) throw new Error(`${testCase.name}: hero heading missing`);
            if (initial.fallbackPresent) throw new Error(`${testCase.name}: obsolete fallback is visible`);
            if (initial.decompressionLoaderPresent) throw new Error(`${testCase.name}: obsolete DecompressionStream loader remains`);
            if (initial.projectCount !== 6) throw new Error(`${testCase.name}: expected 6 projects; found ${initial.projectCount}`);
            if (!initial.navPresent || !initial.formPresent || initial.bodyTextLength < 1500) throw new Error(`${testCase.name}: incomplete page DOM`);

            const cookieBox = page.locator('#cookies');
            await page.waitForTimeout(700);
            if (await cookieBox.isVisible()) await page.locator('#essential').click();

            await page.locator('.filter[data-filter="domy"]').click();
            const visibleHouseProjects = await page.locator('.project:not(.hidden)').count();
            if (visibleHouseProjects !== 2) throw new Error(`${testCase.name}: house filter showed ${visibleHouseProjects}, expected 2`);
            await page.locator('.filter[data-filter="all"]').click();

            await page.locator('.project-open').first().click();
            await page.waitForSelector('#lightbox.open', { state: 'visible', timeout: 10000 });
            if (!(await page.locator('#lightbox-image').getAttribute('src'))) throw new Error(`${testCase.name}: project lightbox image source missing`);
            await page.locator('#close').click();
            await page.waitForSelector('#lightbox', { state: 'hidden', timeout: 10000 });

            let mobileMenuTested = false;
            const menu = page.locator('#menu');
            if (await menu.isVisible()) {
              mobileMenuTested = true;
              await menu.click();
              if ((await menu.getAttribute('aria-expanded')) !== 'true') throw new Error(`${testCase.name}: mobile menu aria state failed`);
              if (!(await page.locator('#nav').evaluate(node => node.classList.contains('open')))) throw new Error(`${testCase.name}: mobile menu did not open`);
              await menu.click();
            }

            await page.locator('#kontakt').scrollIntoViewIfNeeded();
            await page.locator('#contact-form button[type="submit"]').click();
            const validationMessage = await page.locator('#status').innerText();
            if (!validationMessage.includes('Uzupełnij wymagane pola')) throw new Error(`${testCase.name}: empty form validation failed`);

            await page.locator('input[name="name"]').fill('Test użytkownika');
            await page.locator('input[name="email"]').fill('test@example.com');
            await page.locator('select[name="type"]').selectOption({ label: 'Mieszkanie' });
            await page.locator('textarea[name="message"]').fill('Test działania formularza demonstracyjnego.');
            await page.locator('.consent input').check();
            await page.locator('#contact-form button[type="submit"]').click();
            const successMessage = await page.locator('#status').innerText();
            if (!successMessage.includes('Formularz działa prawidłowo')) throw new Error(`${testCase.name}: completed form state failed`);

            await page.locator('#start').scrollIntoViewIfNeeded();
            const screenshot = `alicja-${testCase.name}.jpg`;
            await page.screenshot({
              path: path.join(outputDir, screenshot),
              fullPage: true,
              type: 'jpeg',
              quality: 78
            });

            await context.close();
            await browser.close();
            return {
              browser: testCase.name,
              passed: true,
              responseStatus: response.status(),
              ...initial,
              visibleHouseProjects,
              lightboxTested: true,
              mobileMenuTested,
              validationMessage,
              successMessage,
              consoleErrors,
              pageErrors,
              failedRequests,
              screenshot
            };
          }

          (async () => {
            const results = [];
            for (const testCase of cases) results.push(await testBrowser(testCase));
            const report = {
              passed: true,
              verifiedAt: new Date().toISOString(),
              canonicalUrl: process.env.LIVE_URL,
              testedUrl: url,
              workflowRunId: process.env.GITHUB_RUN_ID,
              workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
              trustedMainCommit: process.env.GITHUB_SHA,
              httpBytes: Number(process.env.HTTP_BYTES),
              httpSha256: process.env.HTTP_SHA256,
              browsers: results
            };
            fs.writeFileSync(path.join(outputDir, 'alicja-live.json'), JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
          })().catch(error => {
            fs.writeFileSync(path.join(outputDir, 'alicja-browser-failure.txt'), `${error.stack || error}\n`);
            console.error(error);
            process.exit(1);
          });
          NODE

          node /tmp/alicja-browser-test/verify.cjs 2>&1 \
            | tee deployment-verification/alicja-browser.log

      - name: Write final verification outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          state=failed
          if [ "${{ needs.deploy.result }}" = "success" ] \
            && [ "${{ steps.http.outcome }}" = "success" ] \
            && [ "${{ steps.browser_install.outcome }}" = "success" ] \
            && [ "${{ steps.browser.outcome }}" = "success" ] \
            && [ -f deployment-verification/alicja-live.json ]; then
            state=passed
          fi

          cat > deployment-verification/alicja-workflow-outcome.json <<EOF
          {
            "state": "${state}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "triggerEvent": "${GITHUB_EVENT_NAME}",
            "triggerCommit": "${GITHUB_SHA}",
            "deployJobResult": "${{ needs.deploy.result }}",
            "httpStepOutcome": "${{ steps.http.outcome }}",
            "browserInstallOutcome": "${{ steps.browser_install.outcome }}",
            "browserStepOutcome": "${{ steps.browser.outcome }}",
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload all diagnostics as workflow artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: alicja-live-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-verification/alicja-*
          if-no-files-found: error
          retention-days: 30

      - name: Commit pass or failure evidence to trusted main
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alicja Live Verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-verification/alicja-*
          if git diff --cached --quiet; then
            echo 'No new verification evidence to commit.'
            exit 0
          fi
          state="$(python3 -c "import json; print(json.load(open('deployment-verification/alicja-workflow-outcome.json'))['state'])")"
          git commit -m "Record Alicja public-site verification: ${state} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
