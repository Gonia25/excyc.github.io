name: Deploy and verify Alicja Studio live site

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: read

env:
  LIVE_URL: https://gonia25.github.io/excyc.github.io/alicja-studio-wnetrz/
  SOURCE_FILE: alicja-studio-wnetrz/index.html

jobs:
  deploy-and-verify:
    name: Deploy trusted main without protected-environment cancellation
    if: ${{ startsWith(github.event.pull_request.head.ref, 'agent/alicja-trusted-deploy') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted main branch only
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm corrected direct HTML is being packaged
        shell: bash
        run: |
          set -euo pipefail
          test -f "${SOURCE_FILE}"
          grep -Fq '<title>Alicja Studio Wnętrz — architektura wnętrz</title>' "${SOURCE_FILE}"
          grep -Fq 'Wnętrza tworzone' "${SOURCE_FILE}"
          test "$(grep -o 'class="project reveal"' "${SOURCE_FILE}" | wc -l | tr -d ' ')" = '6'
          ! grep -Fq 'Ta przeglądarka nie obsługuje prezentacji' "${SOURCE_FILE}"
          ! grep -Fq 'DecompressionStream' "${SOURCE_FILE}"

      - name: Record exact trusted deployment run
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-verification
          cat > deployment-verification/alicja-trusted-active.json <<EOF
          {
            "state": "running",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "triggerEvent": "${GITHUB_EVENT_NAME}",
            "triggerPullRequest": "${{ github.event.pull_request.number }}",
            "triggerHeadBranch": "${{ github.event.pull_request.head.ref }}",
            "trustedMainCommit": "$(git rev-parse HEAD)",
            "startedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name 'Alicja Trusted Deployment'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployment-verification/alicja-trusted-active.json
          git commit -m 'Record active trusted Alicja deployment [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload complete static repository
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages artifact directly from trusted job
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 3600000
          error_count: 30
          reporting_interval: 10000

      - name: Poll actual public URL for the corrected artifact
        id: http
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-verification
          url="${LIVE_URL}?trusted-proof=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          log="deployment-verification/alicja-trusted-${GITHUB_RUN_ID}-http.log"
          : > "${log}"
          passed=0
          for attempt in $(seq 1 90); do
            code="$(curl --location --silent --show-error \
              --output /tmp/alicja-trusted-live.html \
              --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache, no-store, must-revalidate' \
              --header 'Pragma: no-cache' \
              "${url}" 2>>"${log}" || true)"
            bytes="$(wc -c < /tmp/alicja-trusted-live.html 2>/dev/null | tr -d ' ' || echo 0)"
            title=0; heading=0; projects=0; fallback=0; loader=0
            grep -Fq '<title>Alicja Studio Wnętrz — architektura wnętrz</title>' /tmp/alicja-trusted-live.html 2>/dev/null && title=1 || true
            grep -Fq 'Wnętrza tworzone' /tmp/alicja-trusted-live.html 2>/dev/null && heading=1 || true
            projects="$(grep -o 'class="project reveal"' /tmp/alicja-trusted-live.html 2>/dev/null | wc -l | tr -d ' ')"
            grep -Fq 'Ta przeglądarka nie obsługuje prezentacji' /tmp/alicja-trusted-live.html 2>/dev/null && fallback=1 || true
            grep -Fq 'DecompressionStream' /tmp/alicja-trusted-live.html 2>/dev/null && loader=1 || true
            printf 'attempt=%s http=%s bytes=%s title=%s heading=%s projects=%s fallback=%s loader=%s\n' \
              "${attempt}" "${code}" "${bytes}" "${title}" "${heading}" "${projects}" "${fallback}" "${loader}" | tee -a "${log}"
            if [ "${code}" = '200' ] && [ "${title}" = '1' ] && [ "${heading}" = '1' ] \
              && [ "${projects}" = '6' ] && [ "${fallback}" = '0' ] && [ "${loader}" = '0' ]; then
              passed=1
              break
            fi
            sleep 10
          done
          test "${passed}" = '1'
          cp /tmp/alicja-trusted-live.html "deployment-verification/alicja-trusted-${GITHUB_RUN_ID}-live.html"
          bytes="$(wc -c < /tmp/alicja-trusted-live.html | tr -d ' ')"
          sha256="$(sha256sum /tmp/alicja-trusted-live.html | awk '{print $1}')"
          cat > "deployment-verification/alicja-trusted-${GITHUB_RUN_ID}-http.json" <<EOF
          {
            "state": "passed",
            "canonicalUrl": "${LIVE_URL}",
            "testedUrl": "${url}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "httpStatus": 200,
            "titleMatched": true,
            "heroMatched": true,
            "projectCount": 6,
            "obsoleteFallbackPresent": false,
            "decompressionLoaderPresent": false,
            "bytes": ${bytes},
            "sha256": "${sha256}",
            "verifiedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "test_url=${url}" >> "${GITHUB_OUTPUT}"

      - name: Install Chromium and WebKit verification runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/alicja-trusted-browser
          cd /tmp/alicja-trusted-browser
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit

      - name: Exercise the real public site in desktop Chromium and iPad WebKit
        env:
          TEST_URL: ${{ steps.http.outputs.test_url }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/alicja-trusted-browser/verify.cjs <<'NODE'
          const { chromium, webkit, devices } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const output = path.resolve(process.env.GITHUB_WORKSPACE, 'deployment-verification');
          const cases = [
            ['desktop-chromium', chromium, { viewport: { width: 1440, height: 1000 }, locale: 'pl-PL' }],
            ['ipad-webkit', webkit, { ...devices['iPad Pro 11'], locale: 'pl-PL' }]
          ];

          async function exercise([name, engine, options]) {
            const browser = await engine.launch({ headless: true });
            const context = await browser.newContext(options);
            const page = await context.newPage();
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
            page.on('pageerror', error => pageErrors.push(String(error)));
            const response = await page.goto(process.env.TEST_URL, { waitUntil: 'domcontentloaded', timeout: 90000 });
            if (!response || response.status() !== 200) throw new Error(`${name}: HTTP ${response?.status()}`);
            await page.waitForSelector('.hero h1', { state: 'visible', timeout: 30000 });
            await page.waitForTimeout(1200);
            const state = await page.evaluate(() => ({
              title: document.title,
              heading: document.querySelector('.hero h1')?.innerText || '',
              projectCount: document.querySelectorAll('.project').length,
              fallback: document.body.innerText.toLowerCase().includes('przeglądarka nie obsługuje prezentacji'),
              loader: document.documentElement.innerHTML.includes('DecompressionStream'),
              bodyWidth: document.body.scrollWidth,
              viewportWidth: innerWidth
            }));
            if (state.title !== 'Alicja Studio Wnętrz — architektura wnętrz') throw new Error(`${name}: wrong title`);
            if (!state.heading.includes('Wnętrza tworzone')) throw new Error(`${name}: intended hero missing`);
            if (state.projectCount !== 6) throw new Error(`${name}: expected six projects`);
            if (state.fallback || state.loader) throw new Error(`${name}: obsolete loader survived`);
            if (state.bodyWidth > state.viewportWidth + 2) throw new Error(`${name}: horizontal overflow`);

            const cookies = page.locator('#cookies');
            if (await cookies.isVisible()) await page.locator('#essential').click();
            await page.locator('#realizacje').scrollIntoViewIfNeeded();
            await page.locator('.filter[data-filter="domy"]').click();
            await page.waitForTimeout(200);
            const houses = await page.locator('.project:not(.hidden)').count();
            if (houses !== 2) throw new Error(`${name}: portfolio filter returned ${houses}`);
            await page.locator('.filter[data-filter="all"]').click();
            await page.locator('.project-open').first().click();
            await page.waitForSelector('#lightbox.open', { state: 'visible', timeout: 10000 });
            await page.locator('#close').click();

            let mobileMenuTested = false;
            const menu = page.locator('#menu');
            if (await menu.isVisible()) {
              mobileMenuTested = true;
              await menu.click();
              if ((await menu.getAttribute('aria-expanded')) !== 'true') throw new Error(`${name}: mobile menu aria state failed`);
              if (!(await page.locator('#nav').evaluate(node => node.classList.contains('open')))) throw new Error(`${name}: mobile menu did not open`);
              await menu.click();
            }

            await page.locator('#kontakt').scrollIntoViewIfNeeded();
            await page.locator('#contact-form button[type="submit"]').click();
            const validation = await page.locator('#status').innerText();
            if (!validation.includes('Uzupełnij wymagane pola')) throw new Error(`${name}: empty-form validation failed`);
            await page.locator('input[name="name"]').fill('Test użytkownika');
            await page.locator('input[name="email"]').fill('test@example.com');
            await page.locator('select[name="type"]').selectOption({ label: 'Mieszkanie' });
            await page.locator('textarea[name="message"]').fill('Test działania formularza demonstracyjnego.');
            await page.locator('.consent input').check();
            await page.locator('#contact-form button[type="submit"]').click();
            const success = await page.locator('#status').innerText();
            if (!success.includes('Formularz działa prawidłowo')) throw new Error(`${name}: completed form failed`);

            const screenshot = `alicja-trusted-${process.env.GITHUB_RUN_ID}-${name}.png`;
            await page.locator('#start').scrollIntoViewIfNeeded();
            await page.screenshot({ path: path.join(output, screenshot), fullPage: true });
            await browser.close();
            return { name, passed: true, responseStatus: response.status(), state, houses, mobileMenuTested, validation, success, consoleErrors, pageErrors, screenshot };
          }

          (async () => {
            const browsers = [];
            for (const item of cases) browsers.push(await exercise(item));
            const report = {
              state: 'passed',
              canonicalUrl: process.env.LIVE_URL,
              testedUrl: process.env.TEST_URL,
              workflowRunId: process.env.GITHUB_RUN_ID,
              workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
              verifiedAt: new Date().toISOString(),
              browsers
            };
            fs.writeFileSync(path.join(output, `alicja-trusted-${process.env.GITHUB_RUN_ID}-browser.json`), JSON.stringify(report, null, 2) + '\n');
            console.log(JSON.stringify(report, null, 2));
          })().catch(error => {
            fs.writeFileSync(path.join(output, `alicja-trusted-${process.env.GITHUB_RUN_ID}-browser-failure.txt`), `${error.stack || error}\n`);
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/alicja-trusted-browser/verify.cjs | tee "deployment-verification/alicja-trusted-${GITHUB_RUN_ID}-browser.log"

      - name: Upload live proof artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: alicja-trusted-live-proof-${{ github.run_id }}
          path: deployment-verification/alicja-trusted-${{ github.run_id }}-*
          if-no-files-found: warn
          retention-days: 30

      - name: Commit successful live proof to main
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Alicja Trusted Deployment'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "deployment-verification/alicja-trusted-${GITHUB_RUN_ID}-"*
          git commit -m "Record Alicja trusted live proof passed run ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
